[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pmcortex"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bs4>=0.0.2",
    "fastcoref>=2.1.6",
    "goatools>=1.6.4",
    "httpx>=0.28.1",
    "ipykernel>=7.2.0",
    "loguru>=0.7.2",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "pandas>=3.0.1",
    "pyyaml>=6.0.3",
    "spacy>=3.8.14",
    "transformers<5",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pmcortex*"]
